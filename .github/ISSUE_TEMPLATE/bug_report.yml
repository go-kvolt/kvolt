name: "🐛 Bug Report"
description: "File a bug report to help us improve KVolt"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps or Code to Reproduce
      description: A minimal reproducible example in Go.
      placeholder: |
        package main
        ...
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "e.g., Go version (go version), OS / Architecture (e.g. Ubuntu 24.04 amd64, macOS arm64, Windows 11)"
      placeholder: "go version go1.27.4 windows/amd64"
    validations:
      required: true
